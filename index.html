function mkLead(type,market,i){
  const city=market.split(", ")[0],state=market.split(", ")[1]||"GA";
  const fn=rnd(F),ln=rnd(L),name=`${fn} ${ln}`;
  const base={id:`${type}-${i}-${Date.now()+i}`,type,city,state,zip:String(ri(10000,99999)),phone:ph(),email:`${fn.toLowerCase()}.${ln.toLowerCase()}${ri(1,99)}@${rnd(["gmail.com","yahoo.com","outlook.com","icloud.com"])}`,score:ri(5,10),savedAt:null,status:"new",userNotes:"",arv:"",repairs:"",fee:"",repliedAt:null};
  if(type==="cash"){const llc=Math.random()>0.4,n=llc?rnd(LLCS):name;return{...base,name:n,address:addr(),source:"Deed Records",notes:`Active cash buyer, ${ri(3,48)} deals closed. Fast close, no contingencies.`,details:{"Deals(24mo)":ri(3,48),"Avg Price":`$${ri(80,350)}k`,"Close Speed":`${ri(7,21)} days`,"Buy Box":rnd(["SFR 3/2+","Any condition","Value-add","Off-market","Multi-family"])}};}
  if(type==="preforeclosure"){return{...base,name,address:addr(),source:rnd(["NOD Filing","Lis Pendens","Tax Delinquency"]),notes:`${ri(3,18)} months delinquent. ${ri(15,85)}% equity. Auction in ~${ri(14,120)} days.`,details:{"Filing":rnd(["NOD","Lis Pendens","Tax Lien"]),"Months Delinquent":ri(3,18),"Equity":`${ri(15,85)}%`,"Est ARV":`$${ri(100,450)}k`,"Days to Auction":ri(14,120)}};}
  if(type==="probate"){return{...base,name:`Estate of ${name}`,address:addr(),source:"Probate Court",notes:`Estate opened ${ri(1,8)} months ago. Executor motivated to liquidate quickly.`,details:{"Case #":`${ri(2022,2025)}-PR-${ri(10000,99999)}`,"Est Value":`$${ri(130,600)}k`,"Executor":`${rnd(F)} ${rnd(L)}`,"Months Open":ri(1,8),"Status":rnd(["Vacant","Tenant-occupied","Estate held"])}};}
  if(type==="code"){const v=rnd(VIOLS);return{...base,name,address:addr(),source:"Code Enforcement",notes:`Open violation: ${v}. ${ri(30,540)} days unresolved. Wants to sell as-is.`,details:{"Violation":v,"Days Open":ri(30,540),"Repair Est":`$${ri(8,95)}k`,"Fines":`$${ri(500,9000)}`,"Status":rnd(["Open","Non-compliant","Pending Hearing"])}};}
}

function genZones(metro){
  const names=ZONE_NAMES[metro.id]||Array.from({length:15},(_,i)=>`Zone ${i+1}`);
  return names.map((name,i)=>{
    const sv=ri(8,130),pv=ri(2,85),ls=ri(1,45),ba=ri(1,10);
    return{id:`${metro.id}-${i}`,name,salesVol:sv,permitVol:pv,lotSales:ls,builderActivity:ba,heat:Math.round((sv*0.4+pv*0.35+ls*0.25)/2),medPrice:ri(85,320),trend:ri(-12,42),topBuilders:Array.from({length:ri(1,3)},()=>({name:rnd(BUILDERS),permits:ri(3,32),avgPrice:`$${ri(180,450)}k`})),recentSales:["Nov","Dec","Jan","Feb","Mar","Apr","May"].map(m=>({month:m,sales:ri(3,28)}))};
  }).sort((a,b)=>b.heat-a.heat);
}

function heatColor(val,max,alpha=1){
  const p=Math.min(val/max,1);
  if(p>0.75)return`rgba(255,${Math.round(50+p*80)},0,${alpha})`;
  if(p>0.5)return`rgba(255,${Math.round(140+p*60)},0,${alpha})`;
  if(p>0.25)return`rgba(255,${Math.round(190+p*40)},50,${alpha})`;
  return`rgba(80,200,100,${alpha})`;
}
function heatLabel(v,max){const p=v/max;return p>0.75?{label:"🔥 Red Hot",color:"#FF4500"}:p>0.5?{label:"🌡️ Hot",color:"#FF8C00"}:p>0.25?{label:"⚡ Active",color:"#FFD700"}:{label:"🌱 Emerging",color:"#00FF87"};}

function DealCalc({lead,onUpdate}){
  const[show,setShow]=useState(false);
  const arv=parseFloat(lead.arv)||0,rep=parseFloat(lead.repairs)||0,fee=parseFloat(lead.fee)||0;
  const mao=arv>0?arv*0.7-rep-fee:null,profit=arv>0?arv*0.3-rep:null;
  return<div style={{marginBottom:10}}>
    <button onClick={e=>{e.stopPropagation();setShow(v=>!v);}} style={{background:"#ffffff08",color:"#888",border:"1px solid #ffffff11",borderRadius:7,padding:"6px 12px",fontSize:11,cursor:"pointer",width:"100%",textAlign:"left"}}>🧮 {show?"Hide":"Show"} Deal Calculator</button>
    {show&&<div onClick={e=>e.stopPropagation()} style={{background:"#0a0a1f",borderRadius:8,padding:12,marginTop:6,border:"1px solid #ffffff0d"}}>

        ))}
      </div>
      {mao!==null?<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        <div style={{background:mao>0?"#00FF8715":"#FF444415",borderRadius:7,padding:"8px 12px",border:`1px solid ${mao>0?"#00FF8733":"#FF444433"}`}}>

function OutreachCard({lead,log,onOpenScript}){
  const seq=SEQUENCES[lead.type]||SEQUENCES.preforeclosure;
  const leadLog=log[lead.id]||{};
  const sentDays=Object.keys(leadLog).map(Number);
  const nextTouch=seq.touches.find(t=>!sentDays.includes(t.day));
  const allDone=sentDays.length>=seq.touches.length;
  return<div style={{background:"#0d0d1a",border:`1px solid ${seq.color}22`,borderLeft:`3px solid ${seq.color}`,borderRadius:10,padding:"13px 14px",marginBottom:10}} className="fi">
    <div style={{display:"flex",justifyContent:"space-between",gap:8,marginBottom:10}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:4}}>
          <span style={{background:seq.color+"22",color:seq.color,fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:20}}>{seq.icon} {seq.label}</span>
          <span style={{background:"#ffffff0d",color:"#666",fontSize:10,padding:"2px 7px",borderRadius:20}}>{seq.sender}</span>
          {allDone&&<span style={{background:"#00FF8722",color:"#00FF87",fontSize:10,padding:"2px 7px",borderRadius:20,fontWeight:700}}>✓ Done</span>}
        </div>
        <div style={{color:"#fff",fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{lead.name}</div>
        <div style={{color:"#555",fontSize:11,marginTop:1}}>📱 {lead.phone}</div>
      </div>
      <div style={{textAlign:"right",flexShrink:0}}>
        <div style={{color:seq.color,fontSize:18,fontWeight:800,fontFamily:"'Syne',sans-serif"}}>{sentDays.length}/{seq.touches.length}</div>
        <div style={{color:"#444",fontSize:9}}>TOUCHES</div>
      </div>
    </div>
    <div style={{display:"flex",gap:4,marginBottom:10}}>
      {seq.touches.map((t,i)=>{const sent=sentDays.includes(t.day),isNext=nextTouch?.day===t.day;return(
        <div key={t.day} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <div style={{width:"100%",height:3,background:sent?seq.color:isNext?seq.color+"44":"#1a1a2e",borderRadius:2}}/>
          <div style={{color:sent?seq.color:isNext?"#888":"#333",fontSize:8,fontWeight:sent||isNext?700:400}}>D{t.day}</div>
        </div>
      );})}
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:5}}>
      {seq.touches.map((touch,i)=>{
        const sent=sentDays.includes(touch.day),isNext=nextTouch?.day===touch.day;
        return<div key={touch.day} style={{display:"flex",gap:8,alignItems:"center"}}>
          <div style={{width:24,height:24,borderRadius:"50%",background:sent?seq.color+"22":isNext?seq.color+"15":"#ffffff05",border:`1px solid ${sent?seq.color:isNext?seq.color+"44":"#ffffff0d"}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <span style={{color:sent?seq.color:isNext?seq.color:"#333",fontSize:9,fontWeight:700}}>{sent?"✓":i+1}</span>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{color:sent?"#555":isNext?"#fff":"#444",fontSize:11,fontWeight:isNext?700:400}}>Day {touch.day} — {touch.label}</div>
          </div>
          <button onClick={()=>onOpenScript(lead,touch,seq)} style={{background:sent?"transparent":isNext?seq.color:"#ffffff08",color:sent?"#444":isNext?"#000":"#555",border:`1px solid ${sent?"#ffffff0d":isNext?"transparent":"#ffffff0d"}`,borderRadius:7,padding:"4px 9px",fontSize:10,fontWeight:700,cursor:"pointer",flexShrink:0}}>{sent?"Resend":"Send"}</button>
        </div>;
      })}
    </div>
  </div>;
}

function LoginPage({onLogin}){

  const[name,setName]=useState("");
  const[confirm,setConfirm]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  const submit=async()=>{
    if(!email||!password){setError("Please enter email and password");return;}
    if(mode==="signup"&&password!==confirm){setError("Passwords don't match");return;}
    if(mode==="signup"&&password.length<6){setError("Password must be at least 6 characters");return;}
    setLoading(true);setError("");
    try{
      const endpoint=mode==="signup"?"signup":"token?grant_type=password";
      const body=mode==="signup"?{email,password,data:{name}}:{email,password};
      const headers={"Content-Type":"application/json","apikey":SUPABASE_KEY};
      if(mode!=="signup")headers["Authorization"]="Bearer "+SUPABASE_KEY;
      const res=await fetch(SUPABASE_URL+"/auth/v1/"+endpoint,{
        method:"POST",
        headers,
        body:JSON.stringify(body)
      });
      let data={};
      try{data=await res.json();}catch(e){}
      if(!res.ok)throw new Error(data.error_description||data.message||data.msg||data.error||"Error "+res.status);
      if(mode==="signup"){
        // Auto sign in after signup
        const loginRes=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
          method:"POST",
          headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},
          body:JSON.stringify({email,password})
        });
        let loginData={};
        try{loginData=await loginRes.json();}catch(e){}
        if(!loginRes.ok)throw new Error(loginData.error_description||"Account created! Please sign in.");
        onLogin({id:loginData.user?.id,email,name});
      }else{
        onLogin({id:data.user?.id||data.id,email,name});
      }
    }catch(err){
      setError(err.message||"Connection failed. Check internet.");
    }
    setLoading(false);
  };

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#070714,#0d0f1f)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:360}}>

              <span style={{color:"#fff"}}>Deal</span><span style={{color:"#39d98a"}}>O</span><span style={{color:"#39d98a"}}>Metor</span>
            </div>
          </div>
          <div style={{color:"#39d98a",fontSize:10,letterSpacing:2}}>MEASURE THE MARKET. MASTER THE DEAL.</div>
        </div>
        <div style={{background:"#0d0d1a",border:"1px solid #ffffff0d",borderRadius:20,padding:24}}>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:800,marginBottom:4,color:"#fff"}}>{mode==="login"?"Welcome Back 👋":"Create Account"}</div>
          <div style={{color:"#555",fontSize:12,marginBottom:20}}>{mode==="login"?"Sign in to your DealOMetor account":"Start closing more deals today"}</div>
          {mode==="signup"&&<div style={{marginBottom:12}}>
            <div style={{color:"#555",fontSize:11,marginBottom:4}}>Full Name</div>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your full name" style={{width:"100%",background:"#111",border:"1px solid #ffffff11",borderRadius:10,padding:"11px 14px",color:"#fff",fontSize:13,outline:"none"}}/>
          </div>}
          <div style={{marginBottom:12}}>
            <div style={{color:"#555",fontSize:11,marginBottom:4}}>Email</div>
            <input value={email} onChange={e=>setEmail(e.target.value)} type="email" placeholder="your@email.com" style={{width:"100%",background:"#111",border:"1px solid #ffffff11",borderRadius:10,padding:"11px 14px",color:"#fff",fontSize:13,outline:"none"}}/>
          </div>
          <div style={{marginBottom:mode==="signup"?12:16}}>
            <div style={{color:"#555",fontSize:11,marginBottom:4}}>Password</div>
            <input value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} type="password" placeholder="••••••••" style={{width:"100%",background:"#111",border:"1px solid #ffffff11",borderRadius:10,padding:"11px 14px",color:"#fff",fontSize:13,outline:"none"}}/>
          </div>
          {mode==="signup"&&<div style={{marginBottom:16}}>
            <div style={{color:"#555",fontSize:11,marginBottom:4}}>Confirm Password</div>
            <input value={confirm} onChange={e=>setConfirm(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} type="password" placeholder="••••••••" style={{width:"100%",background:"#111",border:"1px solid "+(confirm&&confirm!==password?"#FF444466":"#ffffff11"),borderRadius:10,padding:"11px 14px",color:"#fff",fontSize:13,outline:"none"}}/>
            {confirm&&confirm!==password&&<div style={{color:"#FF4444",fontSize:10,marginTop:4}}>Passwords don't match</div>}
          </div>}
          {error&&<div style={{background:error.startsWith("✅")?"#39d98a15":"#FF444415",border:"1px solid "+(error.startsWith("✅")?"#39d98a33":"#FF444433"),borderRadius:8,padding:"8px 12px",color:error.startsWith("✅")?"#39d98a":"#FF4444",fontSize:12,marginBottom:12,lineHeight:1.5}}>{error}</div>}
          <button onClick={submit} disabled={loading} style={{background:loading?"#1a1a1a":"linear-gradient(135deg,#39d98a,#00C9FF)",color:loading?"#444":"#000",border:"none",borderRadius:10,padding:"13px 0",fontSize:14,fontWeight:800,cursor:loading?"not-allowed":"pointer",width:"100%",fontFamily:"'Syne',sans-serif",marginBottom:10}}>
            {loading?"Please wait...":(mode==="login"?"Sign In →":"Create Account →")}
          </button>
          <button onClick={async()=>{
            try{
              // Test 1: No headers (avoids CORS preflight)
              setError("Test 1: Plain fetch...");
              const r1=await fetch("https://kqsxbfnjpwtupmmmmstwf.supabase.co/auth/v1/health");
              setError("✅ Plain fetch works! Status: "+r1.status);
            }catch(e1){
              try{
                // Test 2: Try fetching anything external
                setError("Test 2: External fetch...");
                const r2=await fetch("https://httpbin.org/get");
                setError("✅ External works ("+r2.status+") but Supabase plain GET fails: "+e1.message);
              }catch(e2){
                setError("❌ ALL external fetches blocked. Network/VPN/Firewall issue. e1:"+e1.message+" e2:"+e2.message);
              }
            }
          }} style={{background:"transparent",color:"#555",border:"1px solid #333",borderRadius:10,padding:"8px 0",fontSize:11,cursor:"pointer",width:"100%",marginBottom:4}}>🔍 Run Connection Diagnostic</button>
          <div style={{textAlign:"center",color:"#444",fontSize:12}}>
            {mode==="login"?"Don't have an account? ":"Already have an account? "}
            <button onClick={()=>{setMode(mode==="login"?"signup":"login");setError("");}} style={{background:"transparent",border:"none",color:"#39d98a",fontSize:12,fontWeight:700,cursor:"pointer"}}>{mode==="login"?"Sign Up Free":"Sign In"}</button>
          </div>
        </div>
        <div style={{textAlign:"center",marginTop:14,color:"#333",fontSize:10}}>dealometor.com · © 2025 All Rights Reserved</div>
      </div>
    </div>
  );
}

function App(){
  const[user,setUser]=useState(null);
  const loginUser=(u)=>{localStorage.setItem('sb_user',JSON.stringify(u));setUser(u);};
  const logoutUser=()=>{localStorage.removeItem('sb_user');setUser(null);};
  const[authChecked,setAuthChecked]=useState(false);
  const[page,setPage]=useState("crm");

  // ── SUPABASE AUTH ──
  useEffect(()=>{
    // Check for stored session
    try{
      const stored=localStorage.getItem('sb_user');
      if(stored){const u=JSON.parse(stored);setUser(u);}
    }catch(e){}
    setAuthChecked(true);
  },[]);

  if(!authChecked)return<div style={{minHeight:"100vh",background:"#070714",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{color:"#39d98a",fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:800}}>DealOMetor</div></div>;
  if(!user)return<LoginPage onLogin={loginUser}/>;

  // ── MODALS & UI STATE ──
  const[showMenu,setShowMenu]=useState(false);
  const[showTutorial,setShowTutorial]=useState(()=>!localStorage.getItem("df_tutorial_done"));
  const[tutStep,setTutStep]=useState(0);
  const[showSupport,setShowSupport]=useState(false);
  const[showFAQ,setShowFAQ]=useState(false);
  const[showVideoTuts,setShowVideoTuts]=useState(false);
  const[showAgreement,setShowAgreement]=useState(null);
  const[showCallLog,setShowCallLog]=useState(null);
  const[showOffer,setShowOffer]=useState(null);

  const nextTut=()=>{if(tutStep>=TUTORIAL_STEPS.length-1){setShowTutorial(false);localStorage.setItem("df_tutorial_done","1");}else setTutStep(p=>p+1);};
  const skipTut=()=>{setShowTutorial(false);localStorage.setItem("df_tutorial_done","1");};

  // Toast
  const[toast,setToast]=useState(null);
  const showToast=(msg,color="#39d98a")=>{setToast({msg,color});setTimeout(()=>setToast(null),2500);};

  // ── CRM STATE ──
  const[crmMarkets,setCrmMarkets]=useState(()=>{try{const s=localStorage.getItem("df_markets");return s?JSON.parse(s):ALL_MARKETS.slice(0,20);}catch{return ALL_MARKETS.slice(0,20);}});
  const[crmMarket,setCrmMarket]=useState("Atlanta, GA");
  const[customMkt,setCustomMkt]=useState("");
  const[showAddMkt,setShowAddMkt]=useState(false);
  const[crmSel,setCrmSel]=useState(["preforeclosure","cash"]);
  const[leads,setLeads]=useState([]);
  const[saved,setSaved]=useState([]);
  const[cloudSynced,setCloudSynced]=useState(false);
  // Load leads from Supabase on login
  useEffect(()=>{
    if(!user)return;
    sb.from('leads').select('*').eq('user_id',user.id).order('saved_at',{ascending:false}).then(({data,error})=>{
      if(data&&!error){const mapped=data.map(r=>({...r,id:r.id,savedAt:r.saved_at,followUpDate:r.follow_up_date,repliedAt:r.replied_at,offerAmount:r.offer_amount,offerStatus:r.offer_status,userNotes:r.user_notes||'',calls:r.calls||[],details:r.details||{}}));setSaved(mapped);}
      setCloudSynced(true);
    });
  },[user]);
  const[dismissed,setDismissed]=useState([]);
  const[crmLoading,setCrmLoading]=useState(false);
  const[crmTab,setCrmTab]=useState("search");
  const[typeFilter,setTypeFilter]=useState("all");
  const[statusFilter,setStatusFilter]=useState("all");
  const[sortBy,setSortBy]=useState("score");

  useEffect(()=>{try{localStorage.setItem("df_saved_v2",JSON.stringify(saved));}catch{}},[saved]);
  useEffect(()=>{try{localStorage.setItem("df_markets",JSON.stringify(crmMarkets));}catch{}},[crmMarkets]);

  const addMarket=()=>{const m=customMkt.trim();if(!m)return;if(!crmMarkets.includes(m))setCrmMarkets(p=>[...p,m]);setCrmMarket(m);setCustomMkt("");setShowAddMkt(false);showToast(`✓ Added: ${m}`);};
  const runSearch=async()=>{if(!crmSel.length)return;setCrmLoading(true);setLeads([]);setDismissed([]);await new Promise(r=>setTimeout(r,900));const all=crmSel.flatMap(type=>Array.from({length:10},(_,i)=>mkLead(type,crmMarket,i))).sort((a,b)=>b.score-a.score);setLeads(all);setCrmLoading(false);setCrmTab("leads");};
  const saveLead=lead=>{if(saved.find(s=>s.id===lead.id)){showToast("Already saved!","#FB923C");return;}setSaved(p=>{const nl={...lead,savedAt:new Date().toISOString(),status:"new",userNotes:"",calls:[]};saveLeadToCloud(nl);return[nl,...p];});showToast(`✓ Saved: ${lead.name}`);};
  const removeSaved=id=>{setSaved(p=>p.filter(l=>l.id!==id));showToast("Removed","#FF4444");};
  const saveLeadToCloud=async(lead)=>{
    if(!user)return;
    const row={user_id:user.id,name:lead.name,address:lead.address,city:lead.city,state:lead.state,zip:lead.zip,phone:lead.phone,email:lead.email,type:lead.type,score:lead.score,status:lead.status||'new',source:lead.source,notes:lead.notes,user_notes:lead.userNotes||'',arv:lead.arv||'',repairs:lead.repairs||'',fee:lead.fee||'',offer_amount:lead.offerAmount||'',offer_status:lead.offerStatus||'',replied_at:lead.repliedAt||null,follow_up_date:lead.followUpDate||null,calls:lead.calls||[],details:lead.details||{},saved_at:lead.savedAt||new Date().toISOString()};
    if(lead.id&&lead.id.length===36&&!lead.id.startsWith('lead-')){
      await sb.from('leads').upsert({...row,id:lead.id});
    }else{
      const{data}=await sb.from('leads').insert(row).select().single();
      if(data)return data.id;
    }
  };
  const removeLeadFromCloud=async(id)=>{
    if(!user||!id||id.length!==36)return;
    await sb.from('leads').delete().eq('id',id).eq('user_id',user.id);
  };
  const updateLead=(id,field,value)=>{
    setSaved(p=>p.map(l=>{if(l.id!==id)return l;const updated={...l,[field]:value};saveLeadToCloud(updated);return updated;}));
    setLeads(p=>p.map(l=>l.id===id?{...l,[field]:value}:l));
  };
  const logCall=(leadId,call,followUpDate)=>{setSaved(p=>p.map(l=>l.id===leadId?{...l,calls:[...(l.calls||[]),call],followUpDate:followUpDate||l.followUpDate,status:l.status==="new"?"contacted":l.status}:l));showToast("📞 Call logged!","#39d98a");};
  const saveOffer=(leadId,offer)=>{setSaved(p=>p.map(l=>l.id===leadId?{...l,...offer,status:"made_offer"}:l));showToast("💰 Offer saved!","#FB923C");};
  const getBuyerMatches=lead=>saved.filter(l=>l.type==="cash"&&l.city===lead.city).length;
  const markReplied=(id)=>{
    setSaved(p=>p.map(l=>l.id===id?{...l,repliedAt:new Date().toISOString(),status:l.status==="new"?"contacted":l.status}:l));
    setLeads(p=>p.map(l=>l.id===id?{...l,repliedAt:new Date().toISOString()}:l));
    showToast("🔔 Reply logged! Status updated to Called","#00FF87");
  };
  const exportCSV=data=>{const h=["Name","Type","Address","City","State","Phone","Email","Score","Status","Notes","Source","Saved","Days Old"];const rows=data.map(l=>[l.name,l.type,l.address,l.city,l.state,l.phone,l.email,l.score,l.status||"new",l.userNotes||"",l.source,l.savedAt?new Date(l.savedAt).toLocaleDateString():"",l.savedAt?daysSince(l.savedAt):""]);const csv=[h,...rows].map(r=>r.map(c=>`"${String(c||"").replace(/"/g,'""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`dealflow-${Date.now()}.csv`;a.click();};

  const sortedSaved=useMemo(()=>{
    let arr=saved.filter(l=>(statusFilter==="all"||l.status===statusFilter)&&(typeFilter==="all"||l.type===typeFilter));
    if(sortBy==="score")arr=[...arr].sort((a,b)=>b.score-a.score);
    else if(sortBy==="newest")arr=[...arr].sort((a,b)=>new Date(b.savedAt)-new Date(a.savedAt));
    else if(sortBy==="stale")arr=[...arr].sort((a,b)=>daysSince(b.savedAt)-daysSince(a.savedAt));
    else if(sortBy==="status")arr=[...arr].sort((a,b)=>STATUSES.findIndex(s=>s.id===a.status)-STATUSES.findIndex(s=>s.id===b.status));
    else if(sortBy==="replied")arr=[...arr].sort((a,b)=>(b.repliedAt?1:0)-(a.repliedAt?1:0));
    // Always float replied leads to top
    arr=[...arr.filter(l=>l.repliedAt),...arr.filter(l=>!l.repliedAt)];
    return arr;
  },[saved,statusFilter,typeFilter,sortBy]);

  const visibleLeads=leads.filter(l=>!dismissed.includes(l.id)&&(typeFilter==="all"||l.type===typeFilter));
  const staleCount=saved.filter(l=>daysSince(l.savedAt)>=30&&l.status==="new").length;
  const avgScore=leads.length?(leads.reduce((s,l)=>s+l.score,0)/leads.length).toFixed(1):"0";

  // ── HEAT STATE ──
  const[allZoneData]=useState(()=>{const d={};METROS.forEach(m=>{d[m.id]=genZones(m);});return d;});
  const[heatMetro,setHeatMetro]=useState(METROS[0]);
  const[selectedZone,setSelectedZone]=useState(null);
  const[heatTab,setHeatTab]=useState("zones");
  const[heatFilter,setHeatFilter]=useState("all");
  const[showMetroPicker,setShowMetroPicker]=useState(false);
  const[metroSearch,setMetroSearch]=useState("");

  const zones=allZoneData[heatMetro.id]||[];
  const maxHeat=useMemo(()=>Math.max(...zones.map(z=>z.heat)),[zones]);
  const filteredZones=useMemo(()=>{let arr=[...zones];if(heatFilter==="builders")arr=arr.filter(z=>z.builderActivity>=6);else if(heatFilter==="lots")arr=[...arr].sort((a,b)=>b.lotSales-a.lotSales);else if(heatFilter==="sales")arr=[...arr].sort((a,b)=>b.salesVol-a.salesVol);return arr;},[zones,heatFilter]);

  const rankedMetros=useMemo(()=>METROS.map(m=>{const zs=allZoneData[m.id]||[];const score=Math.round((zs.reduce((s,z)=>s+z.salesVol,0)*0.4+zs.reduce((s,z)=>s+z.permitVol,0)*0.35+zs.reduce((s,z)=>s+z.lotSales,0)*0.25)/10);return{...m,score,hotZones:zs.filter(z=>z.heat>50).length,totalSales:zs.reduce((s,z)=>s+z.salesVol,0),totalPermits:zs.reduce((s,z)=>s+z.permitVol,0)};}).sort((a,b)=>b.score-a.score),[allZoneData]);
  const maxMScore=Math.max(...rankedMetros.map(m=>m.score));

  const findBuyersInZone=(marketName)=>{setCrmMarket(marketName);if(!crmMarkets.includes(marketName))setCrmMarkets(p=>[...p,marketName]);setCrmSel(["cash"]);setPage("crm");setCrmTab("search");showToast(`🔍 Searching cash buyers in ${marketName}`,"#00FF87");};

  // ── OUTREACH STATE ──
  const[outLog,setOutLog]=useState(()=>{try{const s=localStorage.getItem("df_outreach_log");return s?JSON.parse(s):{};}catch{return{};}});
  const[activeScript,setActiveScript]=useState(null);
  const[outFilter,setOutFilter]=useState("all");
  const[outSearch,setOutSearch]=useState("");
  const[outTab,setOutTab]=useState("leads");

  useEffect(()=>{try{localStorage.setItem("df_outreach_log",JSON.stringify(outLog));}catch{}},[outLog]);

  const markSent=(leadId,day)=>{setOutLog(prev=>{const updated={...prev,[leadId]:{...(prev[leadId]||{}),[day]:{sentAt:new Date().toISOString()}}};return updated;});showToast("✓ Marked as sent");};

  const startOutreach=(lead)=>{setPage("outreach");setOutTab("leads");setOutSearch(lead.name);};

  const outLeads=saved.filter(l=>(outFilter==="all"||l.type===outFilter)&&(!outSearch||l.name.toLowerCase().includes(outSearch.toLowerCase())||l.city?.toLowerCase().includes(outSearch.toLowerCase())));
  const totalSent=Object.values(outLog).reduce((s,v)=>s+Object.keys(v).length,0);
  const activeSeq=saved.filter(l=>outLog[l.id]&&Object.keys(outLog[l.id]).length>0&&Object.keys(outLog[l.id]).length<5).length;
  const completedSeq=saved.filter(l=>outLog[l.id]&&Object.keys(outLog[l.id]).length>=5).length;

  // ── GLOBAL HEADER ──
  const headers={
    crm:{title:"CRM",sub:"LEADS & PIPELINE",icon:"🏘️",color:"#00FF87"},
    heat:{title:"HEAT MAP",sub:"MARKET INTELLIGENCE",icon:"🔥",color:"#FF6B35"},
    outreach:{title:"OUTREACH",sub:"TEXT SEQUENCES",icon:"💬",color:"#00C9FF"},
  };
  const h=headers[page];

  return(
    <div style={{minHeight:"100vh",background:"#070714",color:"#fff"}}>
      {/* ── MODALS ── */}
      {showTutorial&&<TutorialOverlay step={tutStep} onNext={nextTut} onSkip={skipTut}/>}
      {showMenu&&<HamburgerMenu onClose={()=>setShowMenu(false)} onTutorial={()=>{setTutStep(0);setShowTutorial(true);}} onSupport={()=>setShowSupport(true)} onFAQ={()=>setShowFAQ(true)} onVideoTuts={()=>setShowVideoTuts(true)}/>}
      {showSupport&&<AISupportChat onClose={()=>setShowSupport(false)}/>}
      {showFAQ&&<FAQPage onClose={()=>setShowFAQ(false)}/>}
      {showVideoTuts&&<VideoTutorialsPage onClose={()=>setShowVideoTuts(false)}/>}
      {showAgreement&&<AgreementModal lead={showAgreement} onClose={()=>setShowAgreement(null)}/>}
      {showCallLog&&<CallLogModal lead={showCallLog} onClose={()=>setShowCallLog(null)} onSave={logCall}/>}
      {showOffer&&<OfferModal lead={showOffer} onClose={()=>setShowOffer(null)} onSave={saveOffer}/>}
      <Toast t={toast}/>
      {activeScript&&<ScriptModal touch={activeScript.touch} lead={activeScript.lead} seq={activeScript.seq} onClose={()=>setActiveScript(null)} onMarkSent={markSent}/>}

      {/* GLOBAL TOP BAR */}
      <div style={{background:"linear-gradient(135deg,#070714 0%,#0d0f1f 100%)",borderBottom:"1px solid #1aff7722",padding:"10px 18px 10px 14px",position:"sticky",top:0,zIndex:10,display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 2px 20px #00000066"}}>

            </div>
            {selectedZone&&<ZoneDetail zone={selectedZone} metro={heatMetro} maxHeat={maxHeat} onClose={()=>setSelectedZone(null)} onFindBuyers={findBuyersInZone}/>}
            {filteredZones.map((zone,i)=><ZoneCard key={zone.id} zone={zone} rank={i+1} maxHeat={maxHeat} onSelect={z=>setSelectedZone(selectedZone?.id===z.id?null:z)} selected={selectedZone?.id===zone.id}/>)}
          </div>}

          {heatTab==="compare"&&<div>
            <div style={{background:"#0d0d1a",borderRadius:10,border:"1px solid #ffffff08",padding:"11px 14px",marginBottom:14}}>
              <div style={{color:"#FF6B35",fontSize:11,fontWeight:700,marginBottom:3}}>📊 All Markets Ranked</div>
              <div style={{color:"#555",fontSize:12,lineHeight:1.6}}>Ranked by combined sales, permits, and lot activity over 6 months.</div>
            </div>
            {rankedMetros.map((m,i)=>(
              <div key={m.id} className="fi" style={{background:"#0d0d1a",border:`1px solid ${heatColor(m.score,maxMScore,0.3)}`,borderLeft:`3px solid ${heatColor(m.score,maxMScore,1)}`,borderRadius:10,padding:"11px 14px",marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                      <span style={{color:"#444",fontSize:11,fontWeight:700}}>#{i+1}</span>
                      <span style={{color:"#fff",fontSize:13,fontWeight:700}}>{m.name}</span>
                      {i===0&&<span style={{background:"#FF450022",color:"#FF4500",fontSize:9,padding:"1px 6px",borderRadius:10,fontWeight:700}}>🔥 #1</span>}
                    </div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      <span style={{color:"#555",fontSize:11}}>🏠 {m.totalSales}</span>
                      <span style={{color:"#555",fontSize:11}}>🏗️ {m.totalPermits}</span>
                      <span style={{color:"#A78BFA",fontSize:11}}>⚡ {m.hotZones} hot</span>
                    </div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{color:heatColor(m.score,maxMScore,1),fontSize:18,fontWeight:800,fontFamily:"'Syne',sans-serif"}}>{m.score}</div>
                    <div style={{color:"#333",fontSize:9}}>SCORE</div>
                  </div>
                </div>
                <div style={{marginTop:7,height:3,background:"#1a1a2e",borderRadius:2,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${(m.score/maxMScore)*100}%`,background:heatColor(m.score,maxMScore,1),borderRadius:2}}/>
                </div>
              </div>
            ))}
          </div>}

          {heatTab==="strategy"&&<div>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:800,marginBottom:3}}>Infill Lot Playbook</div>
            <div style={{color:"#555",fontSize:12,marginBottom:14}}>5 steps from heat map to closed deal</div>
            {[
              {icon:"🔥",title:"1. Find Hot Zones",color:"#FF4500",body:`Filter by Heat Score. In ${heatMetro.name}, you have ${zones.filter(z=>z.heat>50).length} red-hot zones right now.`},
              {icon:"🏗️",title:"2. Target Builder Clusters",color:"#A78BFA",body:"Filter 'Builder Hot' zones. These builders need lots — they buy fast, pay fair, and repeat."},
              {icon:"📦",title:"3. Source Lots in Those Zones",color:"#FB923C",body:"Use code violations, probate, and tax delinquency leads filtered to your hot zones."},
              {icon:"🤝",title:"4. Build Buyer Relationships",color:"#00C9FF",body:"Find the active builders in the zone detail. Google them, call the permit office, reach out directly."},
              {icon:"💰",title:"5. Assign & Scale",color:"#00FF87",body:"Get the lot under contract, assign to your builder, collect your fee. Repeat."},
            ].map((s,i)=>(
              <div key={i} className="fi" style={{background:"#0d0d1a",border:`1px solid ${s.color}22`,borderLeft:`3px solid ${s.color}`,borderRadius:10,padding:"13px 14px",marginBottom:8}}>
                <div style={{display:"flex",gap:10}}>
                  <span style={{fontSize:20,flexShrink:0}}>{s.icon}</span>
                  <div><div style={{color:s.color,fontSize:13,fontWeight:700,marginBottom:3}}>{s.title}</div><div style={{color:"#777",fontSize:12,lineHeight:1.7}}>{s.body}</div></div>
                </div>
              </div>
            ))}
            <button onClick={()=>setPage("crm")} style={{background:"linear-gradient(135deg,#39d98a,#00C9FF)",color:"#000",border:"none",borderRadius:10,padding:"13px 0",fontSize:13,fontWeight:800,cursor:"pointer",width:"100%",fontFamily:"'Syne',sans-serif",marginTop:6}}>🚀 Go to CRM → Find Buyers Now</button>
          </div>}
        </div>
      </div>}

      {/* ═══ OUTREACH ═══ */}
      {page==="outreach"&&<div>
        <div style={{background:"#0a0a1f",borderBottom:"1px solid #ffffff0d",padding:"10px 18px",position:"sticky",top:58,zIndex:8}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
            {[{l:"Sent",v:totalSent,c:"#00FF87"},{l:"Active",v:activeSeq,c:"#00C9FF"},{l:"Done",v:completedSeq,c:"#A78BFA"}].map(s=>(
              <div key={s.l} style={{background:"#ffffff06",borderRadius:8,padding:"7px 10px",textAlign:"center"}}>
                <div style={{color:s.c,fontSize:16,fontWeight:800,fontFamily:"'Syne',sans-serif"}}>{s.v}</div>
                <div style={{color:"#444",fontSize:9,textTransform:"uppercase"}}>{s.l}</div>
              </div>
            ))}
          </div>
        </div>
        <SubTabs tabs={[["leads","📋 My Leads"],["scripts","📝 All Scripts"]]} active={outTab} onChange={setOutTab} color="#00C9FF"/>
        <div style={{padding:"16px 18px",maxWidth:800,margin:"0 auto"}}>

          {outTab==="leads"&&<div>
            <input value={outSearch} onChange={e=>setOutSearch(e.target.value)} placeholder="Search by name or city..." style={{width:"100%",background:"#0d0d1a",border:"1px solid #ffffff11",borderRadius:8,padding:"8px 12px",color:"#fff",fontSize:12,outline:"none",marginBottom:10}}/>
            <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
              {[{id:"all",label:"All"},{id:"preforeclosure",label:"⚠️ Pre-FC"},{id:"probate",label:"⚖️ Probate"},{id:"code",label:"🏚️ Code"},{id:"cash",label:"💵 Cash"}].map(f=>(
                <button key={f.id} onClick={()=>setOutFilter(f.id)} style={{background:outFilter===f.id?"#ffffff12":"transparent",border:`1px solid ${outFilter===f.id?"#ffffff33":"#ffffff08"}`,color:outFilter===f.id?"#fff":"#444",borderRadius:20,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer"}}>{f.label}</button>
              ))}
            </div>
            {outLeads.length>0
              ?outLeads.map(lead=><OutreachCard key={lead.id} lead={lead} log={outLog} onOpenScript={(l,t,s)=>setActiveScript({lead:l,touch:t,seq:s})}/>)
              :<div style={{textAlign:"center",padding:"60px 20px",color:"#333"}}>
                <div style={{fontSize:36,marginBottom:8}}>💬</div>
                <div style={{fontSize:14,color:"#444"}}>No leads in pipeline yet</div>
                <div style={{fontSize:12,marginTop:4,color:"#333"}}>Save leads in the CRM to start outreach sequences</div>
                <button onClick={()=>setPage("crm")} style={{marginTop:14,background:"linear-gradient(135deg,#39d98a,#00C9FF)",color:"#000",border:"none",borderRadius:8,padding:"9px 20px",fontSize:12,fontWeight:700,cursor:"pointer"}}>Go to CRM →</button>
              </div>
            }
          </div>}

          {outTab==="scripts"&&<div>
            <div style={{color:"#555",fontSize:11,marginBottom:14,lineHeight:1.6}}>All 20 scripts across 4 lead types. Edsa handles seller outreach. Shaun handles cash buyers.</div>
            {Object.values(SEQUENCES).map(seq=>(
              <div key={seq.label} style={{marginBottom:20}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                  <span style={{fontSize:18}}>{seq.icon}</span>
                  <div><div style={{color:seq.color,fontSize:13,fontWeight:800}}>{seq.label}</div><div style={{color:"#444",fontSize:11}}>Sender: {seq.sender} · 5-touch sequence</div></div>
                </div>
                {seq.touches.map((touch,i)=>(
                  <div key={touch.day} style={{background:"#0d0d1a",border:`1px solid ${seq.color}15`,borderLeft:`2px solid ${["#00FF87","#00C9FF","#A78BFA","#FB923C","#FF6B35"][i]}`,borderRadius:8,padding:"11px 13px",marginBottom:6}}>
                    <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
                      <div style={{flex:1}}>
                        <div style={{display:"flex",gap:6,marginBottom:4}}>
                          <span style={{background:["#00FF87","#00C9FF","#A78BFA","#FB923C","#FF6B35"][i]+"22",color:["#00FF87","#00C9FF","#A78BFA","#FB923C","#FF6B35"][i],fontSize:10,fontWeight:700,padding:"1px 7px",borderRadius:20}}>Day {touch.day}</span>
                          <span style={{color:"#666",fontSize:11}}>{touch.label}</span>
                        </div>
                        <div style={{color:"#888",fontSize:12,lineHeight:1.6}}>{touch.script("[Name]","[Address]").substring(0,100)}...</div>
                      </div>
                      <button onClick={()=>setActiveScript({lead:{name:"[Name]",address:"[Address]",city:"[City]",state:"XX",phone:"",type:Object.keys(SEQUENCES).find(k=>SEQUENCES[k].label===seq.label)},touch,seq})} style={{background:seq.color+"22",color:seq.color,border:`1px solid ${seq.color}33`,borderRadius:7,padding:"5px 10px",fontSize:10,fontWeight:700,cursor:"pointer",flexShrink:0}}>Preview</button>
                    </div>
                  </div>
                ))}
              </div>
            ))}
          </div>}
        </div>
      </div>}

      {/* BOTTOM NAV */}
      {/* BRANDING BAR - separate from nav */}
      <div style={{position:"fixed",bottom:58,left:0,right:0,background:"#0a0a1f",borderTop:"1px solid #ffffff06",padding:"5px 18px",display:"flex",justifyContent:"center",alignItems:"center",gap:6,zIndex:49}}>
        <span style={{color:"#39d98a",fontSize:9,fontWeight:700,letterSpacing:0.5}}>DealOMetor™</span>
        <span style={{color:"#333",fontSize:9}}>·</span>
        <span style={{color:"#333",fontSize:9,letterSpacing:0.3}}>Measure the Market. Master the Deal.</span>
      </div>

      {/* BOTTOM NAV - 3 equal tabs */}
      <div className="bottom-nav">
        {[
          {id:"crm",icon:"🏘️",label:"CRM",badge:staleCount>0?staleCount:null,badgeColor:"#FF6B35"},
          {id:"heat",icon:"🔥",label:"Heat",badge:null},
          {id:"outreach",icon:"💬",label:"Outreach",badge:totalSent>0?totalSent:null,badgeColor:"#00C9FF"},
        ].map(nav=>(
          <button key={nav.id} className="nav-btn" onClick={()=>setPage(nav.id)} style={{position:"relative",flex:1}}>
            <span style={{fontSize:22}}>{nav.icon}</span>
            <div style={{color:page===nav.id?["crm","heat","outreach"].includes(nav.id)?["#00FF87","#FF6B35","#00C9FF"][["crm","heat","outreach"].indexOf(nav.id)]:"#fff":"#444",fontFamily:"'DM Sans',sans-serif",fontSize:10,fontWeight:700}}>{nav.label}</div>
            {nav.badge&&<div style={{position:"absolute",top:6,right:"50%",transform:"translateX(10px)",background:nav.badgeColor,color:"#000",fontSize:8,fontWeight:800,borderRadius:20,padding:"1px 5px",minWidth:14,textAlign:"center"}}>{nav.badge}</div>}
            {page===nav.id&&<div style={{position:"absolute",bottom:0,left:"15%",right:"15%",height:2,background:["#00FF87","#FF6B35","#00C9FF"][["crm","heat","outreach"].indexOf(nav.id)],borderRadius:2}}/>}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
